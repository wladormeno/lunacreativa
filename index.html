<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Etiqueta Viewport esencial para dispositivos móviles -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUNA Comunicación Creativa — Turismo e Industria</title>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    body { 
      background: #070707; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      overflow-x: hidden;
      padding: 20px;
    }
    #__bundler_thumbnail { 
      position: fixed; 
      inset: 0; 
      width: 100%; 
      height: 100%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      background: #070707; 
      z-index: 9999; 
    }
    #__bundler_thumbnail svg { 
      width: 90%; 
      max-width: 1200px; 
      height: auto; 
      object-fit: contain; 
    }
    /* Estilos responsivos para textos SVG o HTML */
    text, p, h1, h2, a {
      overflow-wrap: break-word;
      word-wrap: break-word;
    }
    #__bundler_loading { 
      position: fixed; 
      bottom: 20px; 
      right: 20px; 
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; 
      color: #666; 
      background: #fff; 
      padding: 8px 14px; 
      border-radius: 8px; 
      box-shadow: 0 1px 4px rgba(0,0,0,0.12); 
      z-index: 10000; 
    }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      Esta página requiere JavaScript para mostrarse.
    </div>
  </noscript>
</head>

    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#070707"></rect>

      <text x="600" y="640" font-family="Montserrat, sans-serif" font-size="80" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="14">LUNA</text>
    </svg>
  </div>
